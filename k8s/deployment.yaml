apiVersion: apps/v1
kind: Deployment
metadata:
  name: weight-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weight-service
  template:
    metadata:
      labels:
        app: weight-service
    spec:
      containers:
        - name: app
          image: weight-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: weight-service
spec:
  type: NodePort
  selector:
    app: weight-service
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080